<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div class="red">Red box</div>
<div class="blue">Blue box</div>

<style>
    .red {
        position: absolute;
        top: 50px;
        left: 50px;
        width: 150px;
        height: 150px;
        background: red;
        z-index: 1; /* nhỏ hơn → nằm dưới */
    }

    .blue {
        position: absolute;
        top: 100px;
        left: 100px;
        width: 150px;
        height: 150px;
        background: blue;
        z-index: 5; /* lớn hơn → nằm trên */
    }
</style>

</body>
</html>
