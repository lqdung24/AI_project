<!-- GUEST PANEL -->
<div id="guestPanel" class="control-panel">
    <h3>🧭 Bảng điều khiển (Guest)</h3>

    <!-- Chế độ Guest / Admin -->
    <div class="row switch-container">
        <span>Guest</span>
        <label class="switch">
            <input type="checkbox" id="modeSwitchGuest">
            <span class="slider"></span>
        </label>
        <span>Admin</span>
    </div>

    <!-- Hiển thị Node / Edge -->
    <div class="row switch-container" style="justify-content: space-between;">
        <div class="switch-item">
            <span>Node</span>
            <label class="switch">
                <input type="checkbox" id="toggleNodeGuest">
                <span class="slider"></span>
            </label>
        </div>
        <div class="switch-item">
            <span>Edge</span>
            <label class="switch">
                <input type="checkbox" id="toggleEdgeGuest">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <!-- Thuật toán -->
    <div class="row">
        <label class="label">Thuật toán</label>
        <select id="algorithm">
            <option disabled selected>Chọn thuật toán</option>
            <option value="dfs">DFS</option>
            <option value="bfs">BFS</option>
            <option value="ids">IDS</option>
            <option value="gbfs">GBFS</option>
            <option value="ucs">UCS</option>
            <option value="astar">A*</option>
        </select>
    </div>

    <!-- Điểm bắt đầu -->
    <div class="row">
        <label class="label">Điểm bắt đầu</label>
        <div class="input-with-marker">
            <img src="https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png" class="leaflet-marker start-marker">
            <input type="text" id="startPoint" placeholder="Nhấn để chọn trên bản đồ" readonly>
        </div>
    </div>

    <!-- Điểm kết thúc -->
    <div class="row">
        <label class="label">Điểm kết thúc</label>
        <div class="input-with-marker">
            <img src="https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png" class="leaflet-marker end-marker">
            <input type="text" id="endPoint" placeholder="Nhấn để chọn trên bản đồ" readonly>
        </div>
    </div>

    <!-- Thông tin -->
    <div class="row info">
        <p>🛣️ Chiều dài: <span id="pathLength">-</span></p>
        <p>⏱️ Thời gian: <span id="pathTime">-</span></p>
    </div>

    <!-- Nút chức năng -->
    <div class="row">
        <button id="findPathBtn">Tìm đường</button>
    </div>

    <div class="row">
        <button id="refreshBtn">Làm mới</button>
    </div>
</div>
