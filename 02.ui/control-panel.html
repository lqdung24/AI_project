<div class="control-panel">
  <h3>🧭 Bảng điều khiển</h3>

  <!-- 1. Công tắc chế độ -->
  <div class="row switch-container">
    <span>Guest</span>
    <label class="switch">
      <input type="checkbox" id="modeSwitch">
      <span class="slider"></span>
    </label>
    <span>Admin</span>
  </div>

  <!-- 2. Chọn thuật toán -->
  <div class="row">
    <label class="label"><i class="icon lucide lucide-cpu"></i>Thuật toán</label>
    <select id="algorithm">
      <option disabled selected>Chọn thuật toán</option>
      <option value="dijkstra">Dijkstra</option>
      <option value="astar">A*</option>
      <option value="bfs">BFS</option>
      <option value="dfs">DFS</option>
    </select>
  </div>

  <!-- 3. Điểm bắt đầu -->
  <div class="row">
    <label class="label"><i class="icon lucide lucide-map-pin"></i>Điểm bắt đầu</label>
    <input type="text" id="startPoint" placeholder="Nhấn để chọn trên bản đồ" readonly>
  </div>

  <!-- 4. Điểm kết thúc -->
  <div class="row">
    <label class="label"><i class="icon lucide lucide-flag"></i>Điểm kết thúc</label>
    <input type="text" id="endPoint" placeholder="Nhấn để chọn trên bản đồ" readonly>
  </div>

  <!-- 5. Nút Tìm đường -->
  <div class="row">
    <button id="findPathBtn"><i class="icon lucide lucide-navigation"></i>Tìm đường</button>
  </div>

  <!-- 6. Nút Làm mới -->
  <div class="row">
    <button id="refreshBtn"><i class="icon lucide lucide-refresh-cw"></i>Làm mới</button>
  </div>
</div>
